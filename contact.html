<!DOCTYPE html>
<html>
<head>
  <title>お問い合わせ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
     <a href="index.html">ホーム</a>
     <a href="detail.html">挑戦</a>
     <a href="tools.html">おすすめ</a>
     <a href="contact.html">お問い合わせ</a>
  </nav>

  <div class="container">
     <h1>お問い合わせ</h1>

     <p>質問や相談があればお気軽にどうぞ</p>

     <form action="https://formspree.io/f/xykablge" method="POST">
         <label>名前</label><br>
         <input type="text" id="name" name="name" placeholder="お名前を入力"><br><br>

         <label>メールアドレス</label><br>
         <input type="email" id="email" name="email" placeholder="example@email.com"><br><br>

         <label>内容</label><br>
         <textarea id="message" rows="5" name="message" placeholder="お問い合わせを入力"></textarea><br><br>

         <button type="submit" class="btn">送信</button>
     </form>
  </div>
  <script src="script.js"></script>

</body>
</html>
